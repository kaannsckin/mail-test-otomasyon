services:
  - type: web
    name: mail-test-otomasyon
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATA_DIR
        value: /data
      - key: UI_PASSWORD
        sync: false          # Render panelinde girilir — arayüz parolası
    disk:
      name: app-data
      mountPath: /data
      sizeGB: 1
