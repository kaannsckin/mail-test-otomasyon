services:
  mail-test-app:
    build: .
    container_name: mail-test-otomasyon
    ports:
      - "5005:5000"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=5000
      - DATA_DIR=/app/data
      # Konteynere tarayıcıdan erişim "ağ" erişimi sayılır: parola zorunlu.
      # Proje kökünde .env dosyasına UI_PASSWORD=... yazın.
      - UI_PASSWORD=${UI_PASSWORD:?UI_PASSWORD ayarlayın (.env dosyasına UI_PASSWORD=... yazın)}
      - UI_USERNAME=${UI_USERNAME:-admin}
    restart: unless-stopped
