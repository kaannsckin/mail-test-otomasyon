services:
  mail-test-app:
    build: .
    container_name: mail-test-otomasyon
    ports:
      - "5005:5000"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=5000
      - DATA_DIR=/app/data
      # Ağa açık çalıştırıyorsanız parola koyun:
      # - UI_PASSWORD=degistir-beni
    restart: unless-stopped
